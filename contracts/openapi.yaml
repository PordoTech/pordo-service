openapi: 3.1.0
info:
  title: Pordo Content Source Service
  version: 0.1.0
  description: |
    Standalone comic content-source service for Pordo clients.

    Conventions:
    - Every JSON response uses an envelope: `{ data, meta?, requestId }` on
      success, `{ error: { code, message, retryable, retryAfter? }, requestId }`
      on failure.
    - `comicId` is the content identity: `sha256(provider \0 siteId \0 detailUrl)`
      (hex), identical to the client's `Book.key`. It is stable across restarts
      and deployments.
    - `assetId` is an access address (HMAC-signed provider/siteId/url triple),
      never persisted as content identity. `detailUrl`/`coverUrl`/page `url`
      always carry original upstream values, never proxy URLs.
    - Device clients authenticate with `Authorization: Bearer pt_...` tokens.
      Admin APIs use the `pordo_admin` session cookie plus `x-csrf-token`.
      Device tokens cannot call admin APIs and vice versa.

servers:
  - url: http://127.0.0.1:8790
    description: Local development

security: []

tags:
  - name: content
    description: Device-facing content API (Bearer device token)
  - name: assets
    description: Signed asset streaming and preparation
  - name: admin-auth
    description: Admin bootstrap, session and CSRF
  - name: admin
    description: Administration (session cookie + CSRF)

paths:
  /api/v1/sources:
    get:
      tags: [content]
      operationId: listSources
      summary: Enabled sources with honest capabilities
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Source list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sources]
                        properties:
                          sources:
                            type: array
                            items: { $ref: '#/components/schemas/PublicSource' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/comics/search:
    get:
      tags: [content]
      operationId: searchComics
      summary: Parallel multi-source search; failing sources become error groups
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: sourceId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Grouped results (site ids are qualified `provider:siteId`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [groups]
                        properties:
                          groups:
                            type: array
                            items: { $ref: '#/components/schemas/SearchGroup' }
                      meta:
                        type: object
                        properties:
                          partial: { type: boolean }
                          pagination: { type: [object, 'null'] }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/comics/resolve:
    post:
      tags: [content]
      operationId: resolveComics
      summary: Batch-resolve legacy identities so old favorites open directly
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comics]
              properties:
                comics:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [provider, siteId, detailUrl]
                    properties:
                      provider: { type: string }
                      siteId: { type: string }
                      detailUrl: { type: string }
                      title: { type: string }
                      coverUrl: { type: string }
      responses:
        '200':
          description: Resolved comic views (comicId = sha256 book key)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [comics]
                        properties:
                          comics:
                            type: array
                            items: { $ref: '#/components/schemas/ComicView' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/comics/{comicId}:
    get:
      tags: [content]
      operationId: getComic
      summary: Comic detail with natural chapter ordering
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ComicId' }]
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [comic, chapters]
                        properties:
                          comic: { $ref: '#/components/schemas/ComicView' }
                          chapters:
                            type: array
                            items: { $ref: '#/components/schemas/ChapterView' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/comics/{comicId}/chapters:
    get:
      tags: [content]
      operationId: getChapters
      summary: Chapter list for a resolved comic
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ComicId' }]
      responses:
        '200':
          description: Chapters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [comic, chapters]
                        properties:
                          comic: { $ref: '#/components/schemas/ComicView' }
                          chapters:
                            type: array
                            items: { $ref: '#/components/schemas/ChapterView' }
                      meta:
                        type: object
                        properties:
                          count: { type: integer }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/comics/{comicId}/chapters/{chapterKey}/pages:
    get:
      tags: [content]
      operationId: getPages
      summary: Page list; urls are upstream originals, assetIds are access addresses
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComicId'
        - name: chapterKey
          in: path
          required: true
          schema: { type: string }
        - name: refresh
          in: query
          required: false
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: Pages with image policy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [chapter, pages, imagePolicy]
                        properties:
                          chapter: { $ref: '#/components/schemas/ChapterView' }
                          pages:
                            type: array
                            items: { $ref: '#/components/schemas/PageView' }
                          imagePolicy: { $ref: '#/components/schemas/ImagePolicy' }
                      meta:
                        type: object
                        properties:
                          count: { type: integer }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/comics/updates/check:
    post:
      tags: [content]
      operationId: checkUpdates
      summary: Queue a batched update-check job
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items: { $ref: '#/components/schemas/UpdateEntry' }
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [jobId]
                        properties:
                          jobId: { type: string }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/jobs/{jobId}:
    get:
      tags: [content]
      operationId: getJob
      summary: Job status and results
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobView' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/assets/prepare:
    post:
      tags: [assets]
      operationId: prepareAssets
      summary: Sign asset ids for legacy stored original URLs (compatibility)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [provider, siteId, url]
                    properties:
                      provider: { type: string }
                      siteId: { type: string }
                      url: { type: string }
      responses:
        '200':
          description: Signed asset ids
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [assets]
                        properties:
                          assets:
                            type: array
                            items:
                              type: object
                              required: [provider, siteId, url, assetId]
                              properties:
                                provider: { type: string }
                                siteId: { type: string }
                                url: { type: string }
                                assetId: { type: string }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/v1/assets/{assetId}:
    get:
      tags: [assets]
      operationId: getAsset
      summary: Stream real image bytes (never a JSON envelope on success)
      description: |
        There is no open URL proxy: asset ids are HMAC-signed
        (provider, siteId, url) triples validated per provider, and private
        destinations are blocked in production. Cache status is exposed via
        `X-Cache` (HIT/MISS). Tickets and cookies never leave the service.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image bytes
          headers:
            X-Cache:
              schema: { type: string, enum: [HIT, MISS] }
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/healthz:
    get:
      tags: [admin-auth]
      operationId: healthz
      summary: Liveness and initialization state (open)
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, uptimeSeconds, initialized]
                        properties:
                          status: { type: string, enum: [ok] }
                          uptimeSeconds: { type: integer }
                          initialized: { type: boolean }

  /api/admin/v1/session:
    get:
      tags: [admin-auth]
      operationId: sessionInfo
      summary: Current admin session info (open; null session when signed out)
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [initialized, session]
                        properties:
                          initialized: { type: boolean }
                          session:
                            type: [object, 'null']
                            required: [username, csrfToken, expiresAt]
                            properties:
                              username: { type: string }
                              csrfToken: { type: string }
                              expiresAt: { type: string, format: date-time }

  /api/admin/v1/setup:
    post:
      tags: [admin-auth]
      operationId: setupAdmin
      summary: One-time admin initialization; auto-login on success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Session created (sets pordo_admin cookie)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [session]
                        properties:
                          session: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: Admin login (scrypt-hashed password; sets session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [session]
                        properties:
                          session: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: End the admin session
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ok]
                        properties:
                          ok: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/password:
    post:
      tags: [admin-auth]
      operationId: changePassword
      summary: Change the admin password
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ok]
                        properties:
                          ok: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/overview:
    get:
      tags: [admin]
      operationId: overview
      summary: Dashboard counters (requests, tokens, cache, jobs, memory)
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - uptimeSeconds
                          - rssBytes
                          - heapUsedBytes
                          - sources
                          - requests24h
                          - activeTokens
                          - resolvedComics
                          - runningJobs
                          - cache
                        properties:
                          uptimeSeconds: { type: integer }
                          rssBytes: { type: integer }
                          heapUsedBytes: { type: integer }
                          sources:
                            type: array
                            items:
                              type: object
                              required: [id, displayName, enabled, accountPhase, quota]
                              properties:
                                id: { type: string }
                                displayName: { type: string }
                                enabled: { type: boolean }
                                accountPhase: { type: [string, 'null'] }
                                quota:
                                  type: [object, 'null']
                                  required: [limit, usage]
                                  properties:
                                    limit: { type: [integer, 'null'] }
                                    usage: { type: [integer, 'null'] }
                          requests24h:
                            type: object
                            required: [total, failed]
                            properties:
                              total: { type: integer }
                              failed: { type: integer }
                          activeTokens: { type: integer }
                          resolvedComics: { type: integer }
                          runningJobs: { type: integer }
                          cache: { $ref: '#/components/schemas/CacheStats' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/sources:
    get:
      tags: [admin]
      operationId: adminListSources
      summary: All sources with runtime config and account state
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sources]
                        properties:
                          sources:
                            type: array
                            items: { $ref: '#/components/schemas/SourceAdminView' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/sources/{id}:
    put:
      tags: [admin]
      operationId: updateSource
      summary: Update enable/priority/proxy/timeout/concurrency/config
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                priority: { type: integer, minimum: 0 }
                proxy: { type: [string, 'null'] }
                timeoutMs: { type: integer, minimum: 1000, maximum: 300000 }
                concurrency: { type: integer, minimum: 1, maximum: 16 }
                config: { type: object }
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [source]
                        properties:
                          source: { $ref: '#/components/schemas/SourceAdminView' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/sources/{id}/account:
    get:
      tags: [admin]
      operationId: getAccount
      summary: Masked account view + live auth state
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [account, state]
                        properties:
                          account:
                            type: [object, 'null']
                            required: [configured, username, hasPassword, autoLogin]
                            properties:
                              configured: { type: boolean }
                              username: { type: string, description: Masked }
                              hasPassword: { type: boolean }
                              autoLogin: { type: boolean }
                          state:
                            oneOf:
                              - $ref: '#/components/schemas/AccountState'
                              - type: 'null'
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
    put:
      tags: [admin]
      operationId: saveAccount
      summary: |
        Save upstream account credentials (encrypted at rest with the master
        key). Empty password keeps the stored one; `clearPassword: true`
        removes it. Passwords are never echoed back; only `hasPassword`.
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                password: { type: string }
                autoLogin: { type: boolean }
                clearPassword: { type: boolean }
      responses:
        '200':
          description: Saved account and post-save auth state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [account, state]
                        properties:
                          account: { $ref: '#/components/schemas/AccountAdminView' }
                          state:
                            oneOf:
                              - $ref: '#/components/schemas/AccountState'
                              - type: 'null'
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
    delete:
      tags: [admin]
      operationId: deleteAccount
      summary: Remove the stored account (logs out upstream first)
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ok]
                        properties:
                          ok: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/sources/{id}/login:
    post:
      tags: [admin]
      operationId: sourceLogin
      summary: Explicit manual login (single-flight; bypasses backoff once)
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: Auth state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [state]
                        properties:
                          state: { $ref: '#/components/schemas/AccountState' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/sources/{id}/logout:
    post:
      tags: [admin]
      operationId: sourceLogout
      summary: Logout upstream and drop stored password/auto-login
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: Auth state (guest)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [state]
                        properties:
                          state:
                            oneOf:
                              - $ref: '#/components/schemas/AccountState'
                              - type: 'null'
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/test/search:
    post:
      tags: [admin]
      operationId: testSearch
      summary: Admin-side search probe for a single source
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, q]
              properties:
                sourceId: { type: string }
                q: { type: string }
      responses:
        '200':
          description: Same shape as content search
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [groups]
                        properties:
                          groups:
                            type: array
                            items: { $ref: '#/components/schemas/SearchGroup' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/test/detail:
    post:
      tags: [admin]
      operationId: testDetail
      summary: Resolve + fetch detail for an arbitrary original detail URL
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, siteId, detailUrl]
              properties:
                provider: { type: string }
                siteId: { type: string }
                detailUrl: { type: string }
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [comic, chapters]
                        properties:
                          comic: { $ref: '#/components/schemas/ComicView' }
                          chapters:
                            type: array
                            items: { $ref: '#/components/schemas/ChapterView' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/test/pages:
    post:
      tags: [admin]
      operationId: testPages
      summary: Page list probe (first 20 pages) for browser verification
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comicId, chapterKey]
              properties:
                comicId: { type: string }
                chapterKey: { type: string }
      responses:
        '200':
          description: Pages probe
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [chapter, imagePolicy, pages, total]
                        properties:
                          chapter: { $ref: '#/components/schemas/ChapterView' }
                          imagePolicy: { $ref: '#/components/schemas/ImagePolicy' }
                          pages:
                            type: array
                            items: { $ref: '#/components/schemas/PageView' }
                          total: { type: integer }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/assets/{assetId}:
    get:
      tags: [admin]
      operationId: adminGetAsset
      summary: Stream an asset under the admin session (browser verification)
      security: [{ adminCookie: [] }]
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image bytes
          headers:
            X-Cache:
              schema: { type: string, enum: [HIT, MISS] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/jobs:
    get:
      tags: [admin]
      operationId: adminListJobs
      summary: Recent jobs
      security: [{ adminCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [jobs]
                        properties:
                          jobs:
                            type: array
                            items: { $ref: '#/components/schemas/JobView' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/logs:
    get:
      tags: [admin]
      operationId: adminLogs
      summary: Bounded, redacted request/upstream/job logs
      security: [{ adminCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: kind
          in: query
          schema: { type: string, enum: [api, upstream, job] }
        - name: sourceId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [logs]
                        properties:
                          logs:
                            type: array
                            items: { $ref: '#/components/schemas/LogRecord' }
                      meta:
                        type: object
                        properties:
                          count: { type: integer }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/cache:
    get:
      tags: [admin]
      operationId: cacheInfo
      summary: Cache settings and stats
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Cache info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [settings, stats]
                        properties:
                          settings: { $ref: '#/components/schemas/CacheSettings' }
                          stats: { $ref: '#/components/schemas/CacheStats' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
    put:
      tags: [admin]
      operationId: updateCache
      summary: Update cache cap/TTL
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxBytes: { type: integer, minimum: 0, maximum: 2147483647 }
                ttlSeconds: { type: integer, minimum: 60 }
      responses:
        '200':
          description: Updated cache info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [settings, stats]
                        properties:
                          settings: { $ref: '#/components/schemas/CacheSettings' }
                          stats: { $ref: '#/components/schemas/CacheStats' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/cache/clear:
    post:
      tags: [admin]
      operationId: clearCache
      summary: Clear cached images (optionally per source)
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceId: { type: string }
      responses:
        '200':
          description: Removed count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [removed, stats]
                        properties:
                          removed: { type: integer }
                          stats: { $ref: '#/components/schemas/CacheStats' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/tokens:
    get:
      tags: [admin]
      operationId: listTokens
      summary: Device tokens (hashes only; plaintext never retrievable)
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tokens]
                        properties:
                          tokens:
                            type: array
                            items: { $ref: '#/components/schemas/TokenRecord' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
    post:
      tags: [admin]
      operationId: createToken
      summary: Create a device token; plaintext returned exactly once
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Created token with plaintext
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/TokenRecord'
                          - type: object
                            required: [token]
                            properties:
                              token:
                                type: string
                                pattern: '^pt_'
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/tokens/{id}/revoke:
    post:
      tags: [admin]
      operationId: revokeToken
      summary: Revoke a device token (immediately rejected afterwards)
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TokenId' }]
      responses:
        '200':
          description: Revoked token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token]
                        properties:
                          token: { $ref: '#/components/schemas/TokenRecord' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }

  /api/admin/v1/tokens/{id}:
    delete:
      tags: [admin]
      operationId: deleteToken
      summary: Delete a device token record
      security: [{ adminCookie: [] }, { csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TokenId' }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ok]
                        properties:
                          ok: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }

components:
  parameters:
    ComicId:
      name: comicId
      in: path
      required: true
      description: sha256 hex of `provider \0 siteId \0 detailUrl`
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    SourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    TokenId:
      name: id
      in: path
      required: true
      schema: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Device token (`pt_...`); scope `content`
    adminCookie:
      type: apiKey
      in: cookie
      name: pordo_admin
      description: Admin session cookie (httpOnly, SameSite=Lax)
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Double-submit CSRF token from the session view

  responses:
    ErrorEnvelope:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    SuccessEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        meta: { type: object }
        requestId: { type: string }

    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message:
              type: string
              description: Human-readable, redacted (never credentials/tickets)
            retryable: { type: boolean }
            retryAfter: { type: integer, minimum: 1 }
        requestId: { type: string }

    PublicSource:
      type: object
      required: [id, displayName, kind, capabilities, imagePolicy]
      properties:
        id: { type: string }
        displayName: { type: string }
        kind: { type: string, enum: [comic, video] }
        capabilities:
          type: object
          properties:
            search: { type: boolean }
            detail: { type: boolean }
            chapters: { type: boolean }
            pages: { type: boolean }
            images: { type: boolean }
            covers: { type: boolean }
            updateCheck: { type: boolean }
            accountLogin: { type: boolean }
            searchPagination: { type: boolean }
            sites: { type: boolean }
        imagePolicy:
          oneOf:
            - $ref: '#/components/schemas/ImagePolicy'
            - type: 'null'

    SourceAdminView:
      type: object
      required:
        - id
        - displayName
        - kind
        - enabled
        - priority
        - proxy
        - timeoutMs
        - concurrency
        - config
        - configSchema
        - account
      properties:
        id: { type: string }
        displayName: { type: string }
        kind: { type: string, enum: [comic, video] }
        enabled: { type: boolean }
        priority: { type: integer }
        proxy: { type: [string, 'null'] }
        timeoutMs: { type: integer }
        concurrency: { type: integer }
        config: { type: object }
        configSchema:
          type: array
          items:
            type: object
            required: [key, label, type]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [string, password, boolean] }
              required: { type: boolean }
              placeholder: { type: string }
        account:
          oneOf:
            - $ref: '#/components/schemas/AccountAdminView'
            - type: 'null'

    AccountAdminView:
      type: object
      required: [configured, username, hasPassword, autoLogin, state]
      properties:
        configured: { type: boolean }
        username: { type: string, description: Masked, e.g. `us***@example.com` }
        hasPassword: { type: boolean }
        autoLogin: { type: boolean }
        state:
          oneOf:
            - $ref: '#/components/schemas/AccountState'
            - type: 'null'

    AccountState:
      type: object
      required: [phase, nickname, message, limit, usage]
      properties:
        phase:
          type: string
          enum: [guest, pending, signing_in, signed_in, error]
        nickname: { type: string }
        message: { type: string }
        limit: { type: [integer, 'null'] }
        usage: { type: [integer, 'null'] }

    SessionView:
      type: object
      required: [username, csrfToken, expiresAt]
      properties:
        username: { type: string }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }

    SearchGroup:
      type: object
      required: [site, books, error]
      properties:
        site:
          type: object
          required: [siteId, siteName, provider]
          properties:
            siteId:
              type: string
              description: Qualified `provider:siteId`
            siteName: { type: string }
            provider: { type: string }
        books:
          type: array
          items: { $ref: '#/components/schemas/ComicView' }
        error: { type: [string, 'null'] }

    ComicView:
      type: object
      required:
        - comicId
        - provider
        - siteId
        - siteName
        - title
        - author
        - description
        - status
        - coverUrl
        - detailUrl
        - coverAssetId
      properties:
        comicId:
          type: string
          pattern: '^[0-9a-f]{64}$'
        provider: { type: string }
        siteId: { type: string }
        siteName: { type: string }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        status: { type: string }
        coverUrl:
          type: string
          description: Original upstream URL (identity), never a proxy URL
        detailUrl:
          type: string
          description: Original upstream URL (identity), never a proxy URL
        coverAssetId:
          type: [string, 'null']
          description: Signed access address for the cover image

    ChapterView:
      type: object
      required: [id, key, name, order, kind]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        order: { type: integer }
        kind: { type: string, enum: [chapter, volume] }

    PageView:
      type: object
      required: [index, url, assetId]
      properties:
        index: { type: integer }
        url:
          type: string
          description: Original upstream URL (identity), never a proxy URL
        assetId:
          type: string
          description: Signed access address used with GET /api/v1/assets/{assetId}

    ImagePolicy:
      type: object
      required: [concurrency, ahead, behind, retainCacheOnRefresh]
      properties:
        concurrency: { type: integer }
        ahead: { type: integer }
        behind: { type: integer }
        retainCacheOnRefresh: { type: boolean }

    UpdateEntry:
      type: object
      required: [provider, siteId, detailUrl]
      properties:
        provider: { type: string }
        siteId: { type: string }
        detailUrl: { type: string }
        knownChapterCount: { type: integer }
        knownLastChapterKey: { type: string }

    UpdateResult:
      type: object
      required: [comicId, provider, siteId, detailUrl, status]
      properties:
        comicId: { type: string }
        provider: { type: string }
        siteId: { type: string }
        detailUrl: { type: string }
        status: { type: string, enum: [ok, error] }
        chapterCount: { type: integer }
        newChapters: { type: integer }
        latestChapterKey: { type: string }
        error: { type: string }

    JobView:
      type: object
      required: [jobId, kind, status, total, completed, createdAt, updatedAt]
      properties:
        jobId: { type: string }
        kind: { type: string }
        status:
          type: string
          enum: [pending, running, done, partial, failed]
        total: { type: integer }
        completed: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        results:
          type: array
          items: { $ref: '#/components/schemas/UpdateResult' }
        error: { type: [string, 'null'] }

    LogRecord:
      type: object
      required: [id, requestId, kind, op, durationMs, createdAt]
      properties:
        id: { type: integer }
        requestId: { type: string }
        kind: { type: string, enum: [api, upstream, job] }
        sourceId: { type: [string, 'null'] }
        op: { type: string }
        status: { type: [integer, 'null'] }
        errorCode: { type: [string, 'null'] }
        durationMs: { type: integer }
        detail: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    CacheSettings:
      type: object
      required: [maxBytes, ttlSeconds]
      properties:
        maxBytes: { type: integer, minimum: 0 }
        ttlSeconds: { type: integer, minimum: 60 }

    CacheStats:
      type: object
      required: [entries, bytes, hits]
      properties:
        entries: { type: integer }
        bytes: { type: [integer, 'null'] }
        hits: { type: [integer, 'null'] }

    TokenRecord:
      type: object
      required: [id, name, prefix, scopes, createdAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
